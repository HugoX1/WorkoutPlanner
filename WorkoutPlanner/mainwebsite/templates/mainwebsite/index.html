{% load static %}
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>

<body>

    <a href="{% url 'dashboard' %}">DASHBOARD</a>

    <div class="login-container">
        <div class="shadow-lg" style="padding: 40px; width: 25%;">
            <img src="{% static 'images/logo.png' %}" alt="Logo" width="40" height="40" class="img-fluid mx-auto d-block">
            <h3 class="fw-bold" style="padding-top: 20px;">Login</h3>
            <p>Continue your journey with WattsFitness</p>
            <form>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword">Password</label>
                </div>
                <div style="padding-bottom: 30px;" class="d-grid gap-2">
                    <button class="btn btn-outline-primary" type="button">Login</button>
                </div>
                <div>
                    <p class="text-center">Dont have a WattsFitness account? <a class="fw-bold" href="{% url 'signup' %}">Register now</a></p>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
