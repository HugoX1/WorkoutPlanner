{% load static %}
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <!-- Link to the Web App Manifest file (defines how the PWA behaves when installed) -->
    <link rel="manifest" href="{% static 'manifest.json' %}">

    <!-- Sets the browser toolbar color on mobile devices when the PWA is launched -->
    <meta name="theme-color" content="#000000">

    <!-- Specifies the icon used when the app is added to the home screen on Apple devices (not needed for android as they are supported natively through Chrome on Android) -->
    <link rel="apple-touch-icon" href="{% static 'images/icon-192x192.png' %}">

    <!-- Makes the app fullscreen and hides browser UI -->
    <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

    <header>
        <div class="px-3 py-2 text-bg-dark border-bottom">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <img src="{% static 'images/logo.png' %}" alt="Logo" width="50" height="50" style="padding-right: 5px" class="d-inline-block align-text-center">
                    <a class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">WattsFitness</a>
                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
                        <li>
                            <i class="bi bi-speedometer2 d-block mx-auto text-center" style="font-size: 24px" fill="currentColor"></i>
                            <a class="nav-link text-white">Dashboard</a>
                        </li>
                        <li>
                            <i class="bi bi-pencil-square d-block mx-auto text-center" style="font-size: 24px" fill="currentColor"></i>
                            <a class="nav-link text-white">Workouts</a>
                        </li>
                        <li>
                            <i class="bi bi-list-nested d-block mx-auto text-center" style="font-size: 24px" fill="currentColor"></i>
                            <a class="nav-link text-white">Exercises</a>
                        </li>
                        <li>
                            <i class="bi bi-person-circle d-block mx-auto text-center" style="font-size: 24px" fill="currentColor"></i>
                            <a class="nav-link text-white">Account</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="px-3 py-2 border-bottom mb-3">
            <div class="container d-flex flex-wrap justify-content-center">
                <a class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">Dashboard</a>
            </div>
        </div>
    </header>

                </div>
            </div>
            <button class="btn btn-outline-danger" type="submit">Logout</button>
        </div>

    <!-- Main Content -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>


    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{% static 'js/serviceworker.js' %}")
                .then(() => console.log("Service Worker Registered"));
          }
    </script>



</body>
</html>
